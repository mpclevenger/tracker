// ---------- RAG engine (mirrors spec §5) ----------
function staleDays(i){ if(!i.updates.length) return i.accepted?daysBetween(i.accepted,TODAY):null; return daysBetween(i.updates[0].at,TODAY); }
function derive(i){
  const fired=[]; let worst='green';
  if(i.status==='closed'||i.status==='archived') return {derived:'green',fired:[],stale:null,toGo:null};
  const bump=(lvl,rule,chip)=>{fired.push([lvl,rule,chip]); if(lvl==='red'||(lvl==='amber'&&worst==='green')) worst=lvl;};
  const toGo = i.goLive?daysBetween(TODAY,i.goLive):null;
  const stale = staleDays(i);
  for(const m of i.milestones){ if(!m.key||m.st==='done') continue; const cmp=m.a||m.f; if(!cmp) continue; const slip=daysBetween(d(m.p),d(cmp));
    if(slip>THRESH.red_slip) bump('red',`${m.n}`,`Milestone slipped ${slip}d`);
    else if(slip>THRESH.amber_slip) bump('amber',`${m.n}`,`Milestone slipped ${slip}d`); }
  if(i.baseline&&i.goLive){ const s=daysBetween(i.baseline,i.goLive); if(s>THRESH.red_golive_slip) bump('red',`Versus baseline ${fmt(i.baseline)}`,`Go-live slipped ${s}d`); }
  for(const r of i.risks){ if(r.r==='H'&&r.st!=='closed'){ if(r.tgt&&d(r.tgt)<TODAY) bump('red',r.title,'High risk past due'); else bump('amber',r.title,'High risk open');} }
  if(toGo!==null&&toGo>=0){
    if(toGo<=THRESH.red_golive_window&&i.controls.some(c=>c.ready==='not_started')) bump('red',i.controls.filter(c=>c.ready==='not_started').map(c=>c.c).join(', '),`Control not ready, go-live in ${toGo}d`);
    if(toGo<=THRESH.amber_golive_window&&i.controls.some(c=>['in_progress','submitted','sent_back'].includes(c.ready))) bump('amber',i.controls.filter(c=>['in_progress','submitted','sent_back'].includes(c.ready)).map(c=>c.c).join(', '),`Control in progress, go-live in ${toGo}d`); }
  if(stale!==null){ if(stale>THRESH.red_stale) bump('red',`Last update ${i.updates[0]?fmt(i.updates[0].at):'never'}`,`Stale ${stale}d`); else if(stale>THRESH.amber_stale) bump('amber',`Last update ${i.updates[0]?fmt(i.updates[0].at):'never'}`,`Stale ${stale}d`); }
  return {derived:worst,fired,stale,toGo};
}
const ORD={green:0,amber:1,red:2};
function evaluate(i){
  const e=derive(i);
  // Auto-expire when the derived RAG gets worse than it was when the override was set (new deterioration).
  if(i.override&&ORD[e.derived]>ORD[i.override.derivedAtSet]){ i.history.push({at:TODAY,by:'SYSTEM',field:'RAG override',from:i.override.value,to:`auto-expired (derived worsened ${i.override.derivedAtSet} → ${e.derived})`}); i.override={...i.override,clearedAt:TODAY}; }
  if(i.override&&i.override.clearedAt) i.override=null;
  e.effective=i.override?i.override.value:e.derived; e.override=i.override;
  const top=e.fired.filter(f=>f[0]===e.derived)[0]; e.rule=top?top[1]:'No rule fired'; e.chip=top?top[2]:'';
  return e;
}
const nextMilestone=i=>i.milestones.filter(m=>m.st!=='done').sort((a,b)=>d(a.f||a.p)-d(b.f||b.p))[0];
const lastSnap=()=>SNAPSHOTS.slice().sort((a,b)=>b.at-a.at)[0];
function priorLine(i){ const s=lastSnap(); const cur=evaluate(i).effective; const Cap=x=>x[0].toUpperCase()+x.slice(1);
  if(!s||!s.rows[i.id]) return `<div class="meta"><span class="muted">New since the last snapshot</span></div>`;
  const prev=s.rows[i.id].rag, tip=`Compared with the last snapshot: ${s.label}`;
  if(prev===cur) return `<div class="meta" title="${esc(tip)}"><span class="muted">— Unchanged (${Cap(cur)})</span></div>`;
  const worse=ORD[cur]>ORD[prev];
  return `<div class="meta" title="${esc(tip)}" style="color:var(--${worse?'red':'green'});font-weight:600;cursor:help">${worse?'▲ Increased':'▼ Decreased'} to ${Cap(cur)} from ${Cap(prev)}</div>`; }
function trend(i){ const s=lastSnap(); if(!s||!s.rows[i.id]) return ''; const prev=ORD[s.rows[i.id].rag], cur=ORD[evaluate(i).effective]; if(cur>prev) return `<span class="trend up">▲ worse than ${s.label.split(' ')[0]} snapshot</span>`; if(cur<prev) return `<span class="trend down">▼ better than ${s.label.split(' ')[0]} snapshot</span>`; return `<span class="trend muted">— unchanged vs ${s.label.split(' ')[0]} snapshot</span>`; }

const canSee = (vis,i) => { if(role.id==='tech_risk') return true; if(vis==='exec') return true; if(vis==='owner') return role.id==='owner'&&i.owner===role.emp; return false; };
const visibleInits = () => INITS.filter(i=> role.id==='tech_risk' ? true : role.id==='owner' ? i.owner===role.emp : i.status!=='proposed');
const seesOverride = () => role.id==='tech_risk'||role.id==='auditor';

const visTag=v=>`<span class="tag ${v}">${v==='exec'?'exec/audit':v}</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- renderers ----------
function render(){
  document.getElementById('nav').innerHTML=NAV().map(([v,l])=>`<a href="#${v}" class="${view===v||(v==='exec'&&view==='initiative')?'on':''}" onclick="go('${v}');return false">${l}</a>`).join('');
  const rs=document.getElementById('roleSel'); if(!rs.options.length){ ROLES.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.label;rs.appendChild(o);}); rs.onchange=e=>setRole(e.target.value);} rs.value=role.id;
  const b=document.getElementById('banner');
  if(snapshotId!=='live'){const s=SNAPSHOTS.find(x=>x.id===snapshotId); b.className='banner snap'; b.innerHTML=`Snapshot: <b>${esc(s.label)}</b> · ${fmt(s.at)} · <a href="#" onclick="snapshotId='live';render();return false">Back to live</a>`;}
  else if(asOf){ b.className='banner snap'; b.innerHTML=`As of <b>${fmt(asOf)}</b> · <a href="#" onclick="asOf=null;render();return false">Back to live</a>`;}
  else { b.className=''; b.innerHTML=''; }
  const app=document.getElementById('app');
  app.innerHTML = ({lifecycle:rLifecycle,exec:rExec,initiative:()=>rInitiative(INITS.find(i=>i.id===selected)),workbench:rWorkbench,owner:()=>rInitiative(INITS.find(i=>i.owner===role.emp)||INITS[0],true),intake:rIntake,audit:rAudit})[view]();
}

function rExec(){
  const snap=snapshotId!=='live'?SNAPSHOTS.find(x=>x.id===snapshotId):null;
  const inits=visibleInits().filter(i=>i.status!=='archived');
  const active=inits.filter(i=>i.status==='active');
  const ev=Object.fromEntries(active.map(i=>[i.id,evaluate(i)]));
  const ragOfLive=i=>snap?(snap.rows[i.id]||{}).rag:ev[i.id].effective;
  const counts={green:0,amber:0,red:0}; active.forEach(i=>{const r=ragOfLive(i); if(r) counts[r]++;});
  const nm=i=>`<a href="#" onclick="go('initiative','${i.id}');return false">${esc(i.name)}</a>`;
  // vs prior view
  const ref = snap ? SNAPSHOTS.filter(x=>x.at<snap.at).sort((a,b)=>b.at-a.at)[0] : lastSnap();
  const refName = ref ? ref.label.split(' ').slice(0,2).join(' ') : null;
  let worse=[],better=[];
  const C=x=>x[0].toUpperCase()+x.slice(1);
  const mvPill=(i,prev,cur)=>`<a href="#" class="mv" title="${C(prev)} → ${C(cur)} since ${ref.label.split(' ')[0]}" onclick="go('initiative','${i.id}');return false">${ORD[cur]>ORD[prev]?'▲':'▼'} ${esc(i.name)}</a>`;
  const movers={red:[],amber:[],green:[]};
  if(ref) active.forEach(i=>{const prev=ref.rows[i.id]; const cur=ragOfLive(i); if(!prev||!cur) return; if(ORD[cur]!==ORD[prev.rag]){ movers[cur].push(mvPill(i,prev.rag,cur)); (ORD[cur]>ORD[prev.rag]?worse:better).push(i.id); }});
  const mon=ref?ref.label.split(' ')[0]:'';
  const prevCounts={green:0,amber:0,red:0}; const atRef=snap?snap.at:TODAY;
  if(ref) active.forEach(i=>{const p=ref.rows[i.id]; if(p) prevCounts[p.rag]++; else prevCounts[ragOfLive(i)]++;});
  const closedN=ref?inits.filter(i=>i.status==='closed'&&i.closed&&i.closed>ref.at&&i.closed<=atRef).length:0;

  // next 90 days
  const soon=active.filter(i=>{const g=snap?snap.rows[i.id]?.goLive:i.goLive; const at=snap?snap.at:TODAY; return g&&daysBetween(at,g)>=0&&daysBetween(at,g)<=90;}).sort((a,b)=>(snap?snap.rows[a.id].goLive:a.goLive)-(snap?snap.rows[b.id].goLive:b.goLive));
  const ctlColor=c=>c.ready==='ready'?'green':(c.ready==='not_started'||c.ready==='sent_back'||c.ready==='not_ready')?'red':'amber';
  const soonRows=soon.map(i=>{const g=snap?snap.rows[i.id].goLive:i.goLive; const at=snap?snap.at:TODAY; const dd=daysBetween(at,g);
    const ctl=snap?null:i.controls; const ready=ctl?ctl.filter(c=>c.ready==='ready').length:0;
    const bar=ctl&&ctl.length?`<div class="gl-ctl" title="${ready} of ${ctl.length} controls ready">${ctl.map(c=>`<span class="sq ${ctlColor(c)}" title="${c.c}"></span>`).join('')}<span class="gl-ctl-txt">${ready===ctl.length?'Controls ready':`${ready} of ${ctl.length} controls ready`}</span></div>`:'';
    return `<div class="gl-row"><div class="gl-days"><b>${dd}</b><span>days</span></div><div class="gl-main"><div>${nm(i)} <span class="muted small">· ${fmt(g)}</span></div>${bar}</div></div>`;}).join('');
  // flags
  const strip=`<div class="strip" style="grid-template-columns:1.3fr 1fr">
    <div class="card"><div class="lbl" title="Active initiatives">Pulse check</div><div class="stats">${['red','amber','green'].map(r=>{const dv=ref?counts[r]-prevCounts[r]:null; return `<div class="stat ${r}" title="${C(r)}"><div class="stat-top"><b>${counts[r]}</b><span>${dv===null?'':dv>0?`▲ ${dv} since ${mon}`:dv<0?`▼ ${-dv} since ${mon}`:`No change`}</span></div>${movers[r].length?`<div class="stat-mv">${movers[r].join('')}</div>`:''}</div>`;}).join('')}${ref?`<div class="stat closed" title="Closed since ${mon}"><div class="stat-top"><b>${closedN}</b><span>closed since ${mon}</span></div></div>`:''}</div></div>
    <div class="card"><div class="lbl" title="Go-lives in the next 90 days">Next 90 days</div>${soon.length?`<div class="gl-list">${soonRows}</div>`:'<div class="muted small" style="margin-top:4px">No go-lives in the next 90 days</div>'}</div>
  </div>`;
  // Tiles only for what needs attention (Amber/Red). Green is a compact list; closed-since-prior-view is its own list.
  const tile=i=>{
    if(snap){ const r=snap.rows[i.id]; return `<div class="tile ${r.rag}" onclick="go('initiative','${i.id}')"><h3>${esc(i.name)}</h3><div class="meta">${name(i.owner)}</div><ul>${r.hl.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>`; }
    const e=evaluate(i); const nm=nextMilestone(i);
    const hl=i.overlays.filter(o=>o.t==='highlight'&&canSee(o.vis,i)).slice(0,3);
    const stale=e.stale!==null&&e.stale>THRESH.amber_stale?`<span class="pill stale">Stale · ${e.stale}d</span>`:'';
    const ov=e.override&&seesOverride()?`<span class="pill override" title="Click for the override reasoning and support" style="cursor:pointer" onclick="event.stopPropagation();showOverride('${i.id}')">Overridden: ${e.derived[0].toUpperCase()+e.derived.slice(1)} → ${e.effective[0].toUpperCase()+e.effective.slice(1)} ›</span>`:'';
    return `<div class="tile ${e.effective}" onclick="go('initiative','${i.id}')"><h3>${esc(i.name)} ${ov} ${stale}</h3>${priorLine(i)}
      <div class="meta">${name(i.owner)} · last update ${i.updates[0]?`${fmt(i.updates[0].at)} (${daysBetween(i.updates[0].at,TODAY)}d ago)`:'never'}</div>
      ${hl.length?`<ul>${hl.map(h=>`<li>${esc(h.text)}</li>`).join('')}</ul>`:`<div class="meta muted" style="margin-top:6px">${esc(e.rule)}</div>`}</div>`; };
  const ragOf=ragOfLive;
  const flagged=active.filter(i=>ragOf(i)&&ragOf(i)!=='green').sort((a,b)=>ORD[ragOf(b)]-ORD[ragOf(a)]);
  const refDate = snap ? (SNAPSHOTS.filter(x=>x.at<snap.at).sort((a,b)=>b.at-a.at)[0]||{at:new Date(0)}).at : (lastSnap()||{at:new Date(0)}).at;
  const refLabel = snap ? 'prior snapshot' : (lastSnap()?`the ${lastSnap().label.split(' ')[0]} snapshot`:'start');

        else{ if(own)act+=inf.req==='A'?btn(`attestItem(${at})`,'Confirm','primary'):btn(`evidenceModal(${at})`,'Submit evidence','primary'); if(canTR)act+=btn(`naModal(${at})`,'Mark N/A'); } }
      return `<tr><td style="width:90px">${mark}</td><td>${c}</td><td class="small muted">${det}</td><td style="white-space:nowrap">${act}</td></tr>`;}).join('');
    const gateRow=(inf.gate||g)?`<div class="small" style="margin:6px 0 2px 18px"><b>Gate review</b>: ${g?`${decPill(g)} ${esc(g.approver)}, ${fmt(g.at)} · ${evLink(g.ev)}${g.conditions?` · Conditions: ${esc(g.conditions)}`:''} <span class="muted">· recorded by ${name(g.by)} ${fmt(g.recordedAt)}</span>`:`<span class="muted">${inf.itemsOk?'Ready for review':'Waiting for items'}</span>`}${canTR&&inf.itemsOk&&(!g||g.decision==='hold')?` <button class="sm primary" onclick="recordGate('${i.id}',${k})">Record gate review</button>`:''}</div>`:'';
    return `<details ${k===cur?'open':''} style="margin:4px 0"><summary style="cursor:pointer"><span class="swatch" style="background:${st.color}"></span><b>${k}. ${st.n}</b> ${reqTag(i,k)} <span class="small muted">${inf.done}/${inf.total} complete${k===cur?' · current stage':''}${mts.length?` · ${mts.length} meeting${mts.length>1?'s':''}`:''}</span> ${decPill(g)}${k<cur&&!inf.complete?' <span class="small" style="color:var(--amber)">incomplete</span>':''}</summary>
      <table style="margin:4px 0 0 18px;width:auto">${items}</table>
      ${gateRow}
      ${mts.length?`<div class="small" style="margin:6px 0 0 18px">${mts.map(m=>`${fmt(m.at)} · <a href="#" onclick="initTab='meetings';render();return false">${esc(m.what)}</a>`).join('<br>')}</div>`:''}
      <div class="small" style="margin:4px 0 0 18px"><a href="#" onclick="toast('Opens the stage page in TRAC');return false">Guidance in TRAC →</a></div></details>`;}).join('');
  return `<div class="card"><h3 style="margin-top:0">Stage checklist <span class="small muted">· current: ${STAGES[cur].n}</span></h3>${rows}</div>`;
}


function rAudit(){
  const snaps=`<div class="card"><h3 style="margin-top:0">Point in time</h3><div class="row"><div><label class="small muted">Snapshot — "what was presented"</label><br><select onchange="snapshotId=this.value;asOf=null;go('exec')"><option value="live">Live</option>${SNAPSHOTS.map(s=>`<option value="${s.id}">${esc(s.label)} · ${fmt(s.at)}</option>`).join('')}</select></div><div><label class="small muted">As-of date — "what the system held"</label><br><input type="date" value="2026-10-15" onchange="asOf=new Date(this.value+'T12:00:00-05:00');go('exec')"></div></div></div>`;
  return `<h1>Audit</h1>${snaps}`;
}

// hash routing + boot
const start=location.hash.replace('#','');
if(['exec','workbench','intake','audit','owner','lifecycle'].includes(start)) view=start;
render();
</script>
